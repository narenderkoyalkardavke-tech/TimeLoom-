{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Task | TimeLoom</title>

    <link rel="stylesheet"
          href="{% static 'productivity/css/style.css' %}">
</head>

<body>

<div class="main-content">

    <header class="header">
        <h1>Delete Task</h1>
        <a href="{% url 'task_list' %}">Back to My Tasks</a>
    </header>

    <div class="task-card">

        <h2>Are you sure?</h2>

        <p>
            Do you really want to delete
            <strong>{{ task.title }}</strong>?
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn">
                Yes, Delete Task
            </button>

            <a href="{% url 'task_list' %}">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
