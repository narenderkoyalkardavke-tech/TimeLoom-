{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TimeLoom</title>

    <link rel="stylesheet"
          href="{% static 'productivity/css/style.css' %}">
</head>

<body>

<div class="main-content">

    <div class="task-card">

        <h1>Welcome Back!</h1>
        <p>Login to your TimeLoom account.</p>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <br><br>

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <br><br>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">Register here</a>
        </p>

    </div>

</div>

</body>
</html>
